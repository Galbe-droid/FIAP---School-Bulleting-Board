services:

  backend:
    build:
      context: schoolbulletingboard-api
    container_name: schoolbulletingboard-api
    ports:
      - "3000:3000"
      - "5555:5555"
    env_file:
      - ./schoolbulletingboard-api/.env
    volumes:
      - ./schoolbulletingboard-api:/app
      - /app;node_modules
    command: npm run dev
    networks:
      - backend-network

  frontend:
    build:
      context: schoolbulletingboard-web
      args:
        VITE_API_URL: http://localhost:3000
    container_name: schoolbulletingboard-web
    ports:
      - "5173:80"
    depends_on:
      - backend

  microfrontend:
    build:
      context: schoolbulletingboard-microfrontend
      args:
        VITE_API_URL: http://localhost:3000
    container_name: schoolbulletingboard-microfrontend
    ports:
      - "5174:5173"
    volumes:
      - ./schoolbulletingboard-microfrontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - backend-network
    depends_on:
      - backend

networks:
  backend-network:
    driver: bridge
